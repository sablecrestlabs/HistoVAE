name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  style:
    name: Style
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '/noci') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install style tools
        run: python -m pip install --upgrade pip black isort

      - name: Check import order
        run: isort --check-only --diff .

      - name: Check formatting
        run: black --check .

  syntax:
    name: Syntax (${{ matrix.backend }}, ${{ matrix.python-version }})
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '/noci') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - pytorch
          - tensorflow
        python-version:
          - "3.9"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q ${{ matrix.backend }}/src

  smoke-pytorch:
    name: Smoke Test (PyTorch)
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '/noci') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyTorch smoke-test dependencies
        run: python -m pip install --upgrade pip torch numpy

      - name: Run PyTorch smoke test
        working-directory: pytorch
        run: python -m src.smoke_test

  smoke-tensorflow:
    name: Smoke Test (TensorFlow)
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '/noci') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install TensorFlow smoke-test dependencies
        run: python -m pip install --upgrade pip tensorflow numpy

      - name: Run TensorFlow smoke test
        working-directory: tensorflow
        run: python -m src.smoke_test
