name: Docker Publish

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

jobs:
  publish:
    name: Build And Push ${{ matrix.backend.name }} Image
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message || '', '/noci') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: PyTorch
            image: sablecrestlabs/histovae-pytorch
            dockerfile: pytorch/Dockerfile
          - name: TensorFlow
            image: sablecrestlabs/histovae-tensorflow
            dockerfile: tensorflow/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.backend.image }}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            {
              echo "tags=${image}:latest,${image}:${tag}"
              echo "version_tag=${tag}"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${image}:latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.backend.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
